services:
  php:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: formulario
    restart: always
    ports:
      - 3000:80
    volumes:
      - ./:/var/www/html
    env_file: .env

  mongo:
    image: mongo
    restart: always

  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - 8081:8081

volumes:
  html: {}
