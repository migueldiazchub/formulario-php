services:
  web:
    image: nginx:latest
    ports:
      - "3000:80"
    volumes:
      - ./src:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    links:
      - php
      - mongo

  php:
    image: php:8.2-cli
    restart: always
    volumes:
      - ./src:/var/www/html

  mongo:
    image: mongo:7.0
    hostname: mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
