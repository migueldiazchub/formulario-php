services:
  php:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: formulario
    restart: always
    ports:
      - 3000:80
    volumes:
      - ./:/var/www/html
    env_file: .env

  mongodb:
    image: mongodb/mongodb-atlas-local
    hostname: mongodb
    ports:
      - 27017:27017
    volumes:
      - db:/data/db
      - configdb:/data/configdb
      - mongot:/data/mongot

volumes:
  html: {}
  db:
  configdb:
  mongot:
